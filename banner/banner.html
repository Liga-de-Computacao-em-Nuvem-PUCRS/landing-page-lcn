<style>
  :root{
    --paper:#ffffff; --sky-tint:#eff7fd; --baby:#aed8f2;
    --azure:#2e8bd4; --azure-deep:#1c6aac; --ink:#0b2a45;
    --mint:#58d6ae; --amber:#f0b429; --magenta:#d6409f;
    --border:#dbe8f3; --muted-fg:#4a6885;
    --font-sans:'Inter',system-ui,sans-serif;
    --font-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  @page{ size:600mm 900mm; margin:0; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:600mm; height:900mm; }
  body{
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.011em;
    color:var(--ink);
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }

  /* ===== página = slide.light da capa, em 60x90 ===== */
  .page{
    position:relative; width:600mm; height:900mm; overflow:hidden;
    background:#eff7fd url(assets/sky.jpg) center/cover no-repeat;
    display:flex; flex-direction:column;
    padding:190px 190px 380px;
  }

  /* ---- constelação de ícones AWS SBG (do slide 1, ampliada) ---- */
  .constellation{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  .fl{ position:absolute; opacity:.7; }
  .fl svg{ display:block; width:100%; height:100%; }
  .ghost-big{ opacity:.05; }

  .page > *:not(.constellation){ position:relative; z-index:1; }

  /* ---- eyebrow (mono, tracking largo) ---- */
  .eyebrow{
    font-family:var(--font-mono); font-weight:500;
    font-size:44px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--azure-deep); text-align:center;
  }
  .eyebrow2{ margin-top:26px; font-size:38px; color:var(--muted-fg); }

  /* ---- logo hero ---- */
  .logo-hero{ height:950px; width:auto; display:block; margin:0 auto; }
  .sp-a{ flex:0.75; } .sp-b{ flex:1.25; }

  /* ---- sub (como na capa) ---- */
  .sub{
    margin-top:64px;
    font-family:var(--font-display); font-weight:600;
    font-size:132px; letter-spacing:-.02em; color:var(--azure-deep);
    text-align:center;
  }

  /* ---- horizon ---- */
  .horizon{ height:3px; width:1080px; margin:118px auto 0;
    background:linear-gradient(90deg, transparent, rgba(46,139,212,.42) 25%, rgba(46,139,212,.42) 75%, transparent); }

  /* ---- frase inline com gradientes da marca (paths vetoriais) ---- */
  .phrase{ margin:96px auto 0; }
  .phrase svg{ display:block; }

  /* ---- rodapé APOIO ---- */
  .apoio{ margin-top:0; }
  .apoio-label{ position:absolute; top:0; left:50%; transform:translate(-50%,-50%);
    background:#ffffff; padding:6px 52px; }
  .apoio-label span{
    font-family:var(--font-mono); font-weight:600;
    font-size:42px; letter-spacing:.42em; text-transform:uppercase; color:var(--muted-fg);
  }

  .logos{
    position:relative;
    display:flex; align-items:center; justify-content:space-between; gap:36px;
    background:rgba(255,255,255,.72);
    border:2px solid var(--border);
    border-radius:44px;
    padding:88px 72px 74px;
    box-shadow:0 34px 80px -46px rgba(28,106,172,.45);
  }
  .logo-cell{ flex:1; display:flex; align-items:center; justify-content:center; height:170px; }
  .logo-cell img{ width:auto; object-fit:contain; }
  /* alturas por logo — equilíbrio óptico */
  .l-aws     img{ height:82px; }
  .l-pucrs   img{ height:82px; }
  .l-tecnopuc img{ height:66px; }
  .l-oryza img{ height:150px; }
  .vsep{ width:2px; height:150px; background:var(--border); flex:0 0 auto; }
</style>
</head>
